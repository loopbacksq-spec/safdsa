<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitex Platform</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #4a90e2;
            --danger: #ff5252;
            --success: #66bb6a;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-buttons button {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-buttons button:hover {
            background-color: var(--accent);
            color: white;
        }

        /* Main Content */
        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            border-left: 4px solid var(--accent);
            padding-left: 10px;
            margin-bottom: 20px;
        }

        /* Grid for Games/Sites */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: transform 0.2s;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card-header {
            height: 100px;
            background: linear-gradient(45deg, #2c3e50, #4ca1af);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(255,255,255,0.2);
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .status-approved { background-color: rgba(102, 187, 106, 0.2); color: var(--success); }
        .status-rejected { background-color: rgba(255, 82, 82, 0.2); color: var(--danger); }
        .status-pending { background-color: rgba(255, 193, 7, 0.2); color: #ffc107; }

        .btn-play {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: var(--accent);
            color: white;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: var(--border-radius);
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-play:hover { opacity: 0.9; }

        /* Forms */
        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            max-width: 600px;
            margin: 0 auto;
            display: none; /* Скрыто по умолчанию */
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        .btn-submit:hover { opacity: 0.9; }

        /* Console Section */
        .console-section {
            margin-top: 20px;
            padding: 20px;
            background-color: #000;
            border: 1px solid #333;
            border-radius: var(--border-radius);
            font-family: 'Courier New', monospace;
        }

        .log-entry {
            color: #0f0;
            margin-bottom: 5px;
        }

        .error-log { color: #f55; }
        
        /* Navigation Logic */
        .hidden { display: none !important; }
        .active-view { display: block !important; }

    </style>
</head>
<body>

<header>
    <a href="#" class="logo" onclick="showHome()">Sitex</a>
    <div class="nav-buttons">
        <button onclick="showHome()">🏠 Главная</button>
        <button onclick="showConsole()">💻 Консоль</button>
    </div>
</header>

<main id="main-content">
    <!-- VIEW: HOME (Рекомендации) -->
    <div id="view-home" class="active-view">
        <h2>Рекомендуемые проекты</h2>
        <div id="games-grid" class="grid">
            <!-- Сюда JS добавит карточки -->
            <p style="color: #666;">Загрузка рекомендаций...</p>
        </div>
    </div>

    <!-- VIEW: UPLOAD FORM -->
    <div id="view-upload" class="form-container hidden">
        <h2>Опубликовать игру/сайт</h2>
        <div class="form-group">
            <label>Название проекта:</label>
            <input type="text" id="upload-title" placeholder="Мой крутой сайт">
        </div>
        <div class="form-group">
            <label>Ссылка на сайт (URL):</label>
            <input type="url" id="upload-url" placeholder="https://example.com">
        </div>
        <div class="form-group">
            <label>Описание:</label>
            <textarea id="upload-desc" rows="4" placeholder="О чем эта игра или сайт?"></textarea>
        </div>
        <button class="btn-submit" onclick="submitUpload()">Отправить на модерацию AI</button>
        <p id="upload-status" style="margin-top: 10px; text-align: center;"></p>
    </div>

    <!-- VIEW: CONSOLE -->
    <div id="view-console" class="hidden">
        <h2>Панель управления Sitex</h2>
        
        <div class="form-container active-view" style="display: block; margin-bottom: 20px;">
            <h3>Генерация сайта ИИ</h3>
            <p><small>Введите тему, и ИИ напишет код игры.</small></p>
            <div class="form-group">
                <label>Тема генерации:</label>
                <input type="text" id="gen-prompt" placeholder="Например: Космический шутер про Марио">
            </div>
            <button class="btn-submit" onclick="generateSite()">Сгенерировать сайт</button>
        </div>

        <div class="console-section">
            <div style="border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; color: #fff;">СИСТЕМНЫЙ ЛОГ</div>
            <div id="console-output"></div>
        </div>

        <div style="margin-top: 20px;">
            <h3>Команды администратора</h3>
            <div class="form-group">
                <label>Код активации админки:</label>
                <input type="text" id="admin-code" placeholder="Введите команду...">
            </div>
            <button class="btn-submit" style="background-color: var(--accent);" onclick="requestAdmin()">Запросить админку</button>
        </div>
    </div>
</main>

<script>
    // Получаем IP пользователя (эмуляция, так как браузер не знает реальный IP сервера напрямую без API)
    // В реальном приложении лучше передавать IP через backend, но здесь мы используем заглушку для примера
    const USER_IP = "127.0.0.1"; // В идеале нужно сделать запрос к внешнему сервису типа ipify.org
    
    // --- НАВИГАЦИЯ ---
    function showHome() {
        document.getElementById('view-home').classList.add('active-view');
        document.getElementById('view-upload').classList.remove('active-view');
        document.getElementById('view-console').classList.remove('active-view');
        loadGames();
    }

    function showConsole() {
        document.getElementById('view-home').classList.remove('active-view');
        document.getElementById('view-upload').classList.remove('active-view');
        document.getElementById('view-console').classList.add('active-view');
        logToConsole("Консоль открыта. Ожидание команд...");
    }

    function showUpload() {
        document.getElementById('view-home').classList.remove('active-view');
        document.getElementById('view-upload').classList.add('active-view');
        document.getElementById('view-console').classList.remove('active-view');
    }

    // --- ЛОГИКА ЗАГРУЗКИ ИГР ---
    async function submitUpload() {
        const title = document.getElementById('upload-title').value;
        const url = document.getElementById('upload-url').value;
        const desc = document.getElementById('upload-desc').value;
        const statusDiv = document.getElementById('upload-status');

        if (!title || !url || !desc) {
            alert("Заполните все поля!");
            return;
        }

        statusDiv.innerText = "Отправка на проверку AI... Это может занять время.";
        statusDiv.style.color = "#ffc107";

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    targetUrl: url, 
                    title: title, 
                    description: desc, 
                    userIp: USER_IP 
                })
            });

            const data = await response.json();
            
            if (data.error) {
                statusDiv.innerText = "Ошибка: " + data.error;
                statusDiv.style.color = "#ff5252";
            } else {
                statusDiv.innerText = `Успех! Ваш проект получил ID: ${data.shortCode}. Он будет проверен AI.`;
                statusDiv.style.color = "#66bb6a";
                // Очистить форму
                document.getElementById('upload-title').value = '';
                document.getElementById('upload-url').value = '';
                document.getElementById('upload-desc').value = '';
                
                // Показать ссылку для проверки статуса
                setTimeout(() => {
                    alert(`Спасибо! Проверьте статус через 1-2 минуты.\nСсылка для доступа (после одобрения): /${data.shortCode}`);
                }, 1000);
            }
        } catch (err) {
            statusDiv.innerText = "Ошибка сети: " + err.message;
            statusDiv.style.color = "#ff5252";
        }
    }

    // --- ЗАГРУЗКА СПИСКА ИГР ---
    async function loadGames() {
        const grid = document.getElementById('games-grid');
        grid.innerHTML = '<p style="color: #666;">Обновление списка...</p>';

        try {
            const response = await fetch('/api/sites?limit=20');
            const games = await response.json();

            grid.innerHTML = '';
            
            if (games.length === 0) {
                grid.innerHTML = '<p style="color: #666;">Пока нет одобренных игр. Будьте первым!</p>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let statusClass = 'status-pending';
                let statusText = 'Проверка...';
                let btnHtml = `<button class="btn-play" disabled style="background:#444; cursor:not-allowed;">Ждет модерации</button>`;

                if (game.status === 'approved') {
                    statusClass = 'status-approved';
                    statusText = 'Одобрено';
                    btnHtml = `<a href="/${game.shortCode}" class="btn-play">Играть сейчас</a>`;
                } else if (game.status === 'rejected') {
                    statusClass = 'status-rejected';
                    statusText = 'Отклонено';
                    btnHtml = `<div style="padding:10px; font-size:12px; color:#ff5252;">Причина: ${game.reason}</div>`;
                }

                card.innerHTML = `
                    <div class="card-header">🎮</div>
                    <div class="card-body">
                        <div class="card-title">${escapeHtml(game.name)}</div>
                        <div class="card-desc">${escapeHtml(game.description)}</div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        ${btnHtml}
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (err) {
            console.error(err);
            grid.innerHTML = '<p style="color: #ff5252;">Ошибка загрузки списка.</p>';
        }
    }

    // --- КОНСОЛЬ И ГЕНЕРАЦИЯ ---
    function logToConsole(msg, isError = false) {
        const output = document.getElementById('console-output');
        const div = document.createElement('div');
        div.className = isError ? 'error-log' : 'log-entry';
        const time = new Date().toLocaleTimeString();
        div.innerText = `[${time}] ${msg}`;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    async function generateSite() {
        const prompt = document.getElementById('gen-prompt').value;
        if (!prompt) {
            logToConsole("Введите тему генерации!", true);
            return;
        }

        logToConsole("Инициализация генерации кода...");
        
        try {
            const response = await fetch('/api/console/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'generate',
                    data: { prompt: prompt },
                    userIp: USER_IP
                })
            });

            const data = await response.json();
            if (data.success) {
                logToConsole(`Готово! Сайт создан. Код: ${data.shortCode}. Ждите модерации.`);
            } else {
                logToConsole(data.message || "Ошибка генерации", true);
            }
        } catch (err) {
            logToConsole("Ошибка связи с сервером", true);
        }
    }

    async function requestAdmin() {
        const code = document.getElementById('admin-code').value;
        
        // Сначала пробуем команду
        if (code) {
            try {
                const response = await fetch('/api/console/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verify_admin_command',
                        data: { command: code },
                        userIp: USER_IP
                    })
                });
                const data = await response.json();
                logToConsole(data.message);
            } catch (err) {
                logToConsole("Ошибка команды", true);
            }
        } else {
            // Если кода нет, просто отправляем заявку (если IP правильный)
            try {
                const response = await fetch('/api/console/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'request_admin',
                        data: {},
                        userIp: USER_IP
                    })
                });
                const data = await response.json();
                logToConsole(data.message);
            } catch (err) {
                logToConsole("Ошибка отправки заявки", true);
            }
        }
    }

    // Утилита для безопасности HTML
    function escapeHtml(text) {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Загрузка при старте
    window.onload = () => {
        logToConsole("Sitex System initialized.");
        loadGames();
    };
</script>

</body>
</html>
