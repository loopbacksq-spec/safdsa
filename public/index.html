<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Петя AI | Паток</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #fff; --txt: #000; --grid: 24px; }
        body { margin: 0; font-family: 'Courier New', monospace; background: var(--bg); color: var(--txt); overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw;
            background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px);
            background-size: var(--grid) var(--grid);
        }
        #welcome { text-align: center; z-index: 10; transition: opacity 0.5s; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 40px; border: 4px solid #000; box-shadow: 10px 10px 0 #000; max-width: 600px; width: 90%; }
        h1 { font-size: 3rem; margin: 0 0 15px; border-bottom: 6px solid #000; display: inline-block; padding-bottom: 5px; letter-spacing: -3px; text-transform: uppercase; }
        .info { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .creator { font-size: 0.9rem; opacity: 0.7; margin-top: 5px; }
        .btn { background: #000; color: #fff; border: none; padding: 20px 50px; font-size: 1.5rem; cursor: pointer; font-family: inherit; font-weight: 900; margin-top: 30px; transition: all 0.2s; box-shadow: 6px 6px 0 #000; text-transform: uppercase; }
        .btn:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 #000; }
        .btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 #000; }
        
        #chat-ui { display: none; width: 100%; height: 100%; background: #fff; flex-direction: column; position: relative; }
        .top-bar { padding: 15px; border-bottom: 4px solid #000; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        select { padding: 10px; font-family: inherit; font-weight: bold; border: 2px solid #000; background: #fff; outline: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 250px; border-right: 4px solid #000; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #f9f9f9; }
        .new-btn { background: #000; color: #fff; border: none; padding: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 15px; border: 2px solid #000; line-height: 1.6; animation: fadeIn 0.3s; }
        .user { align-self: flex-end; background: #f0f0f0; }
        .bot { align-self: flex-start; background: #fff; }
        .msg strong { display: block; margin-bottom: 8px; font-size: 0.75rem; text-transform: uppercase; }
        pre { background: #000; color: #fff; padding: 15px; border: 2px solid #fff; overflow-x: auto; margin: 10px 0; }
        .input-area { padding: 20px; border-top: 4px solid #000; background: #fff; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border: 2px solid #000; font-family: inherit; font-size: 1rem; }
        .send-btn { padding: 0 30px; background: #000; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        .settings { position: absolute; bottom: 20px; left: 20px; background: #fff; border: 2px solid #000; padding: 20px; display: none; box-shadow: 8px 8px 0 #000; z-index: 20; width: 300px; }
        .warning { font-size: 0.75rem; color: #555; margin-top: 10px; font-style: italic; }
        .typing { font-style: italic; color: #666; border-left: 4px solid #000; padding-left: 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .sidebar { width: 100%; border-right: none; border-bottom: 4px solid #000; flex-direction: row; justify-content: space-between; } .ip-info { display: none; } }
    </style>
</head>
<body>

    <div id="welcome">
        <h1>ПЕТЯ AI</h1>
        <div class="info">КОМПАНИЯ "ПАТОК"</div>
        <div style="margin-bottom: 20px;">Дата: 25.05.2026</div>
        <div class="creator">Разработчик: leymik (Леймик)</div>
        <br><br>
        <button class="btn" onclick="startChat()">НАЧАТЬ ОБЩЕНИЕ</button>
    </div>

    <div id="chat-ui">
        <div class="top-bar">
            <select id="modelSelect">
                <option value="Petya-Flash 1.0">Petya-Flash 1.0 (Быстрая)</option>
                <option value="Petya-Max 1.0">Petya-Max 1.0 (Умная)</option>
                <option value="Petya-Plus">Petya-Plus (База данных)</option>
            </select>
            <button style="border: 2px solid #000; padding: 8px; cursor: pointer;" onclick="toggleSettings()">⚙️</button>
        </div>
        <div class="main">
            <div class="sidebar">
                <button class="new-btn" onclick="newChat()">+ НОВЫЙ ЧАТ</button>
                <div style="font-size: 0.75rem; margin-top: auto; border-top: 1px solid #ccc; padding-top: 10px;">IP: <span id="ip">...</span></div>
            </div>
            <div class="chat-area" id="chatArea"></div>
        </div>
        <div class="input-area">
            <input type="text" id="inp" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">ОТПРАВИТЬ</button>
        </div>
        <div class="settings" id="setPanel">
            <label><input type="checkbox" id="mem" checked> Память включена</label>
            <p class="warning">⚠️ При обновлении чат сбрасывается. ИИ может ошибаться.</p>
            <button onclick="toggleSettings()" style="margin-top: 10px; padding: 5px;">Закрыть</button>
        </div>
    </div>

    <script>
        let history = [];
        let memory = true;
        let currentModelName = "Petya-Flash 1.0";

        window.onload = () => {
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>document.getElementById('ip').innerText=d.ip);
        };

        function startChat() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            addBot("Привет! Я Петя AI. Чем помогу?");
        }

        async function send() {
            const inp = document.getElementById('inp');
            const txt = inp.value.trim();
            if(!txt) return;
            
            addUser(txt);
            inp.value = '';
            const loadId = showLoading();

            try {
                let context = memory ? history.map(m=>({role:m.role, content:m.content})) : [];
                context.push({role: "user", content: txt});

                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: txt,
                        modelType: currentModelName,
                        history: context
                    })
                });

                if(!res.ok) throw new Error("Ошибка сети");
                const data = await res.json();
                
                removeLoad(loadId);
                addBot(data.reply);
                if(memory) {
                    history.push({role:"user", content:txt});
                    history.push({role:"assistant", content:data.reply});
                }

            } catch(e) {
                removeLoad(loadId);
                addBot("Связь с Петей не удалась. Попробуйте ещё раз!");
            }
        }

        function addUser(t) {
            const d = document.createElement('div');
            d.className = 'msg user';
            d.innerHTML = `<strong>ВЫ</strong>${t}`;
            document.getElementById('chatArea').appendChild(d);
            scrollToBottom();
        }

        function addBot(t) {
            const d = document.createElement('div');
            d.className = 'msg bot';
            d.innerHTML = `<strong>ПЕТЯ AI</strong>${marked.parse(t)}`;
            document.getElementById('chatArea').appendChild(d);
            scrollToBottom();
        }

        function showLoading() {
            const id = 'l-'+Date.now();
            const d = document.createElement('div');
            d.id = id;
            d.className = 'msg bot typing';
            d.innerText = 'Петя думает...';
            document.getElementById('chatArea').appendChild(d);
            scrollToBottom();
            return id;
        }

        function removeLoad(id) { document.getElementById(id)?.remove(); }
        function scrollToBottom() { document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight; }
        function toggleSettings() { document.getElementById('setPanel').style.display = document.getElementById('setPanel').style.display==='block'?'none':'block'; }
        function newChat() { history=[]; document.getElementById('chatArea').innerHTML=''; addBot("Новый чат начат."); }

        document.getElementById('modelSelect').onchange = (e) => {
            currentModelName = e.target.value;
        };
        document.getElementById('mem').onchange = (e) => memory = e.target.checked;
    </script>
</body>
</html>
