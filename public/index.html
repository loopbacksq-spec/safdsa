<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Петя AI | Паток</title>
    <!-- Подключаем библиотеку для красивого форматирования текста и кода -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* --- УЛЬТРА КРАСИВЫЙ ДИЗАЙН (БЕЛО-ЧЁРНЫЙ КЛЕТОЧНЫЙ СТИЛЬ) --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #000000;
            --border-color: #000000;
            --grid-size: 24px; /* Размер клетки */
            --font-main: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            
            /* Эффект клетчатой бумаги */
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            background-position: -1px -1px;
        }

        /* --- ЭКРАН ПРИВЕТСТВИЯ --- */
        #welcome-screen {
            text-align: center;
            z-index: 10;
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border: 4px solid var(--accent-color);
            box-shadow: 10px 10px 0px var(--accent-color);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            letter-spacing: -3px;
            border-bottom: 6px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        .company-info {
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .creator {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 5px;
            font-style: italic;
        }

        .btn-start {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 900;
            margin-top: 30px;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 6px 6px 0px var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-start:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px var(--accent-color);
        }

        .btn-start:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px var(--accent-color);
        }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС ЧАТА --- */
        #chat-interface {
            display: none; /* Скрыт по умолчанию */
            width: 100%;
            height: 100%;
            background: #fff;
            flex-direction: column;
            position: relative;
        }

        /* Верхняя панель */
        .top-bar {
            padding: 15px 20px;
            border-bottom: 4px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            z-index: 5;
        }

        .model-selector select {
            padding: 10px 15px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid var(--accent-color);
            background: #fff;
            cursor: pointer;
            outline: none;
            appearance: none; /* Убираем стандартную стрелку */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 15px;
        }

        .settings-btn {
            background: #fff;
            border: 2px solid var(--accent-color);
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .settings-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Основная область (Сайдбар + Чат) */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Левая панель (Сайдбар) */
        .sidebar {
            width: 250px;
            border-right: 4px solid var(--accent-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f9f9f9;
        }

        .new-chat-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .new-chat-btn:hover { opacity: 0.9; }

        .ip-info {
            font-size: 0.75rem;
            color: #555;
            margin-top: auto;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        /* Область чата */
        .chat-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            background: #fff;
        }

        /* Сообщения */
        .message {
            max-width: 85%;
            padding: 15px 20px;
            border: 2px solid var(--accent-color);
            position: relative;
            line-height: 1.6;
            font-size: 1rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user {
            align-self: flex-end;
            background: #f0f0f0;
            border-radius: 0;
        }

        .message.bot {
            align-self: flex-start;
            background: #fff;
        }

        .message strong {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #333;
        }

        /* Код и блоки */
        pre {
            background: #000;
            color: #fff;
            padding: 15px;
            border: 2px solid #fff;
            overflow-x: auto;
            margin: 10px 0;
            position: relative;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
        }

        pre:hover .copy-btn { opacity: 1; }
        .copy-btn:active { background: #ddd; }

        /* Ввод сообщения */
        .input-area {
            padding: 20px;
            border-top: 4px solid var(--accent-color);
            background: #fff;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--accent-color);
            font-family: inherit;
            font-size: 1rem;
            background: #fff;
        }

        input[type="text"]:focus {
            box-shadow: 4px 4px 0px var(--accent-color);
        }

        .send-btn {
            padding: 0 30px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            font-weight: bold;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .send-btn:hover { box-shadow: 3px 3px 0px #555; }

        /* Настройки (всплывающее окно) */
        .settings-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #fff;
            border: 2px solid var(--accent-color);
            padding: 20px;
            display: none;
            box-shadow: 8px 8px 0px var(--accent-color);
            z-index: 20;
            width: 300px;
        }

        .settings-panel label {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .settings-panel input[type="checkbox"] {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            accent-color: var(--accent-color);
        }

        .warning-text {
            font-size: 0.75rem;
            color: #555;
            margin-top: 10px;
            font-style: italic;
            line-height: 1.4;
        }

        .close-settings {
            margin-top: 10px;
            background: #eee;
            border: 1px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        /* Индикатор загрузки */
        .typing-indicator {
            font-style: italic;
            color: #666;
            font-size: 0.9rem;
            padding-left: 20px;
            border-left: 4px solid var(--accent-color);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 4px solid var(--accent-color); flex-direction: row; justify-content: space-between; align-items: center; padding: 10px 20px; }
            .new-chat-btn { padding: 8px 15px; font-size: 0.9rem; }
            .ip-info { display: none; }
            h1 { font-size: 2.5rem; }
            .btn-start { padding: 15px 30px; font-size: 1.2rem; }
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcome-screen">
        <h1>ПЕТЯ AI</h1>
        <div class="company-info">КОМПАНИЯ "ПАТОК"</div>
        <div style="font-size: 1.1rem; margin-bottom: 20px;">Дата создания: 25.05.2026</div>
        <div class="creator">Разработчик: leymik (Леймик)</div>
        <br><br>
        <button class="btn-start" onclick="startChat()">НАЧАТЬ ОБЩЕНИЕ</button>
    </div>

    <!-- ИНТЕРФЕЙС ЧАТА -->
    <div id="chat-interface">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="model-selector">
                <label for="modelSelect" style="margin-right: 10px; font-weight: bold;">МОДЕЛЬ:</label>
                <select id="modelSelect">
                    <option value="Petya-Flash 1.0">Petya-Flash 1.0 (Быстрая)</option>
                    <option value="Petya-Max 1.0">Petya-Max 1.0 (Умная)</option>
                    <option value="Petya-Plus">Petya-Plus (База данных)</option>
                </select>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ НАСТРОЙКИ</button>
        </div>

        <div class="main-container">
            <!-- Левая панель -->
            <div class="sidebar">
                <button class="new-chat-btn" onclick="newChat()">+ НОВЫЙ ЧАТ</button>
                <div class="ip-info">
                    Ваш IP: <span id="user-ip">Определение...</span><br>
                    Сессия зашифрована
                </div>
            </div>

            <!-- Область сообщений -->
            <div class="chat-area" id="chatArea">
                <!-- Сюда будут падать сообщения -->
            </div>
        </div>

        <!-- Поле ввода -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Напишите сообщение Пете..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</button>
        </div>

        <!-- Панель настроек -->
        <div class="settings-panel" id="settingsPanel">
            <label>
                <input type="checkbox" id="memoryToggle" checked> 
                Память во всех чатах (Вкл)
            </label>
            <p class="warning-text">
                ⚠️ ПРИ ОБНОВЛЕНИИ СТРАНИЦЫ ВСЕ ЧАТЫ СБРАСЫВАЮТСЯ.<br>
                ИИ МОЖЕТ ОШИБАТЬСЯ. ПОЛЬЗУЙТЕСЬ С ОСТОРОЖНОСТЬЮ.
            </p>
            <button class="close-settings" onclick="toggleSettings()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ И СОСТОЯНИЕ ---
        let chatHistory = [];
        let isMemoryOn = true;
        let currentModelName = "Petya-Flash 1.0";

        // Инициализация при загрузке
        window.onload = function() {
            // Получаем IP пользователя
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('user-ip').innerText = data.ip;
                })
                .catch(err => {
                    document.getElementById('user-ip').innerText = "Не определён";
                });

            // Генерация случайного ID сессии (для имитации защиты)
            const sessionId = Math.random().toString(36).substring(7);
            history.pushState({id: sessionId}, null, "?chat=" + sessionId);
        };

        // Запуск чата
        function startChat() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('chat-interface').style.display = 'flex';
            addBotMessage("Привет! Я Петя AI от компании Паток. Создан leymik. Чем могу помочь сегодня?");
        }

        // Обработка Enter
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
        document.getElementById('userInput').addEventListener('keypress', handleKeyPress);

        // Отправка сообщения
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            
            if (!message) return;

            // Добавляем сообщение пользователя
            addUserMessage(message);
            inputField.value = '';

            // Показываем индикатор загрузки
            const loadingId = showLoadingIndicator();

            try {
                // Формируем контекст (история диалога)
                let contextMessages = [];
                
                // Если память включена, берем историю
                if (isMemoryOn && chatHistory.length > 0) {
                    contextMessages = chatHistory.map(msg => ({
                        role: msg.role,
                        content: msg.content
                    }));
                }

                // Добавляем текущее сообщение
                contextMessages.push({ role: "user", content: message });

                // Отправляем на наш сервер /api/chat
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message,
                        modelType: currentModelName,
                        history: contextMessages
                    })
                });

                const data = await response.json();

                // Удаляем индикатор
                removeLoadingIndicator(loadingId);

                if (data.error) {
                    addBotMessage(data.message);
                } else {
                    const botReply = data.reply;
                    addBotMessage(botReply);

                    // Сохраняем в историю (если память включена)
                    if (isMemoryOn) {
                        chatHistory.push({ role: "user", content: message });
                        chatHistory.push({ role: "assistant", content: botReply });
                    }
                }

            } catch (error) {
                console.error("Ошибка сети:", error);
                removeLoadingIndicator(loadingId);
                addBotMessage("Связь с Петей не удалась. Попробуйте ещё раз!");
            }
        }

        // --- ФУНКЦИИ ОТРИСОВКИ ---

        function addUserMessage(text) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `<strong>ВЫ</strong>${text}`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function addBotMessage(text) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'message bot';
            
            // Используем marked.js для превращения Markdown в HTML (жирный, код, списки)
            const formattedText = marked.parse(text);
            
            div.innerHTML = `<strong>ПЕТЯ AI</strong>${formattedText}`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function showLoadingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message bot typing-indicator';
            div.innerText = 'Петя думает...';
            chatArea.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Управление настройками
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // Новый чат
        function newChat() {
            chatHistory = []; // Очищаем память
            document.getElementById('chatArea').innerHTML = '';
            addBotMessage("Новый чат начат. Я готов к работе!");
        }

        // Слушатель смены модели
        document.getElementById('modelSelect').addEventListener('change', (e) => {
            currentModelName = e.target.value;
        });

        // Слушатель переключателя памяти
        document.getElementById('memoryToggle').addEventListener('change', (e) => {
            isMemoryOn = e.target.checked;
        });
    </script>
</body>
</html>
