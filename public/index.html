<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Петя AI | Паток</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- УЛЬТРА МОБИЛЬНЫЙ ДИЗАЙН --- */
        :root { --bg: #fff; --txt: #000; --grid: 20px; --accent: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--txt); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw;
            background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
            background-size: var(--grid) var(--grid);
        }

        /* Экран приветствия */
        #welcome {
            text-align: center; z-index: 10; transition: opacity 0.3s ease;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.98); padding: 30px; border: 4px solid var(--accent);
            box-shadow: 8px 8px 0 var(--accent); max-width: 90%; width: 400px;
        }
        h1 { font-size: 2.5rem; margin: 0 0 10px; letter-spacing: -2px; border-bottom: 4px solid var(--accent); display: inline-block; padding-bottom: 5px; text-transform: uppercase; }
        .info { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .creator { font-size: 0.9rem; opacity: 0.7; margin-top: 5px; }
        
        .btn {
            background: var(--accent); color: var(--bg); border: none;
            padding: 15px 40px; font-size: 1.2rem; cursor: pointer; font-family: inherit; font-weight: 900;
            margin-top: 20px; transition: all 0.1s; box-shadow: 4px 4px 0 var(--accent); text-transform: uppercase;
            min-width: 200px;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--accent); }

        /* Интерфейс чата */
        #chat-ui { display: none; width: 100%; height: 100%; background: #fff; flex-direction: column; position: relative; }
        
        /* Верхняя панель с кнопкой меню */
        .top-bar {
            padding: 10px 15px; border-bottom: 3px solid var(--accent);
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; z-index: 50; flex-shrink: 0;
        }

        .menu-btn {
            background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 5px;
            color: var(--accent); font-weight: bold;
        }

        select {
            padding: 8px 12px; font-family: inherit; font-weight: bold;
            border: 2px solid var(--accent); background: #fff; outline: none;
            appearance: none; font-size: 0.9rem;
        }

        /* Область чата (на весь экран) */
        .chat-area {
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth; background: #fff;
        }

        .msg {
            max-width: 90%; padding: 12px 16px; border: 2px solid var(--accent);
            line-height: 1.5; font-size: 1rem; animation: fadeIn 0.2s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .user { align-self: flex-end; background: #e0e0e0; border-radius: 0; }
        .bot { align-self: flex-start; background: #fff; border-radius: 0; }

        .msg strong { display: block; margin-bottom: 6px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        pre {
            background: #000; color: #fff; padding: 10px; border: 1px solid #fff;
            overflow-x: auto; margin: 8px 0; font-size: 0.85rem;
        }

        /* Поле ввода (снизу) */
        .input-area {
            padding: 12px; border-top: 3px solid var(--accent); background: #fff;
            display: flex; gap: 10px; flex-shrink: 0;
        }

        input {
            flex: 1; padding: 12px; border: 2px solid var(--accent);
            font-family: inherit; font-size: 1rem; background: #fff;
        }

        .send-btn {
            padding: 0 25px; background: var(--accent); color: #fff; border: none;
            font-weight: bold; font-size: 1rem; cursor: pointer;
        }

        /* Выезжающее меню (Шторка) */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 60; display: none;
            opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-panel {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: #fff; border-left: 3px solid var(--accent);
            z-index: 70; transition: right 0.3s ease;
            display: flex; flex-direction: column; padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
        }
        .sidebar-panel.active { right: 0; }

        .sidebar-header {
            font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;
            border-bottom: 2px solid var(--accent); padding-bottom: 10px;
        }

        .menu-item {
            padding: 15px; border: 2px solid var(--accent); margin-bottom: 10px;
            background: #fff; font-weight: bold; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .menu-item:active { background: var(--accent); color: #fff; transform: scale(0.98); }

        .settings-panel {
            margin-top: auto; padding-top: 20px; border-top: 2px solid var(--accent);
        }
        .warning { font-size: 0.7rem; color: #555; margin-top: 8px; font-style: italic; }

        .typing { font-style: italic; color: #666; font-size: 0.85rem; padding-left: 15px; border-left: 3px solid var(--accent); }

        /* ПК версия (если нужно, но мы делаем упор на мобилку) */
        @media (min-width: 769px) {
            .sidebar-panel { width: 300px; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcome">
        <h1>ПЕТЯ AI</h1>
        <div class="info">КОМПАНИЯ "ПАТОК"</div>
        <div style="margin-bottom: 15px;">Дата: 25.05.2026</div>
        <div class="creator">Разработчик: leymik (Леймик)</div>
        <br><br>
        <button class="btn" onclick="startChat()">НАЧАТЬ ОБЩЕНИЕ</button>
    </div>

    <!-- ИНТЕРФЕЙС ЧАТА -->
    <div id="chat-ui">
        <!-- Верхняя панель: Меню + Выбор модели -->
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">☰ МЕНЮ</button>
            <select id="modelSelect">
                <option value="Petya-Flash 1.0">Flash</option>
                <option value="Petya-Max 1.0">Max</option>
                <option value="Petya-Plus">Plus</option>
            </select>
        </div>

        <!-- Область чата (вся высота) -->
        <div class="chat-area" id="chatArea">
            <!-- Сообщения будут здесь -->
        </div>

        <!-- Поле ввода -->
        <div class="input-area">
            <input type="text" id="inp" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">➤</button>
        </div>

        <!-- Затемнение фона при открытом меню -->
        <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

        <!-- Боковая панель (выезжает справа) -->
        <div class="sidebar-panel" id="sidebar">
            <div class="sidebar-header">МЕНЮ ПЕТИ</div>
            
            <div class="menu-item" onclick="newChat()">+ НОВЫЙ ЧАТ</div>
            
            <div class="settings-panel">
                <label style="display:flex; align-items:center; gap:8px; font-weight:bold; margin-bottom:10px;">
                    <input type="checkbox" id="mem" checked> Память включена
                </label>
                <p class="warning">⚠️ При обновлении чат сбрасывается.<br>ИИ может ошибаться.</p>
                <div style="font-size:0.7rem; margin-top:10px; color:#555;">IP: <span id="ip">...</span></div>
            </div>
        </div>
    </div>

    <script>
        let history = [];
        let memory = true;
        let currentModelName = "Petya-Flash 1.0";

        window.onload = () => {
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>document.getElementById('ip').innerText=d.ip);
        };

        function startChat() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'flex';
            addBot("Привет! Я Петя AI от компании Паток. Создан leymik. Чем помогу?");
        }

        // Открытие/закрытие меню
        function toggleSidebar() {
            const panel = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const isActive = panel.classList.contains('active');
            
            if (isActive) {
                panel.classList.remove('active');
                overlay.classList.remove('active');
            } else {
                panel.classList.add('active');
                overlay.classList.add('active');
            }
        }

        async function send() {
            const inp = document.getElementById('inp');
            const txt = inp.value.trim();
            if(!txt) return;
            
            addUser(txt);
            inp.value = '';
            const loadId = showLoading();

            try {
                let context = memory ? history.map(m=>({role:m.role, content:m.content})) : [];
                context.push({role: "user", content: txt});

                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: txt,
                        modelType: currentModelName,
                        history: context
                    })
                });

                if(!res.ok) throw new Error("Ошибка сети");
                const data = await res.json();
                
                removeLoad(loadId);
                addBot(data.reply);
                if(memory) {
                    history.push({role:"user", content:txt});
                    history.push({role:"assistant", content:data.reply});
                }

            } catch(e) {
                removeLoad(loadId);
                addBot("Связь с Петей не удалась. Попробуйте ещё раз!");
            }
        }

        function addUser(t) {
            const d = document.createElement('div');
            d.className = 'msg user';
            d.innerHTML = `<strong>ВЫ</strong>${t}`;
            document.getElementById('chatArea').appendChild(d);
            scrollToBottom();
        }

        function addBot(t) {
            const d = document.createElement('div');
            d.className = 'msg bot';
            d.innerHTML = `<strong>ПЕТЯ AI</strong>${marked.parse(t)}`;
            document.getElementById('chatArea').appendChild(d);
            scrollToBottom();
        }

        function showLoading() {
            const id = 'l-'+Date.now();
            const d = document.createElement('div');
            d.id = id;
            d.className = 'msg bot typing';
            d.innerText = 'Петя думает...';
            document.getElementById('chatArea').appendChild(d);
            scrollToBottom();
            return id;
        }

        function removeLoad(id) { document.getElementById(id)?.remove(); }
        function scrollToBottom() { document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight; }
        function newChat() { 
            history=[]; 
            document.getElementById('chatArea').innerHTML=''; 
            addBot("Новый чат начат. Я готов к работе."); 
            toggleSidebar(); // Закрываем меню после создания
        }

        document.getElementById('modelSelect').onchange = (e) => {
            currentModelName = e.target.value;
        };
        document.getElementById('mem').onchange = (e) => memory = e.target.checked;
    </script>
</body>
</html>
