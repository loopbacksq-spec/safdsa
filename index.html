<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Петя AI | Паток</title>
    <!-- Подключаем библиотеку для красивого форматирования кода -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* --- УЛЬТРА КРАСИВЫЙ ДИЗАЙН (БЕЛО-ЧЁРНЫЙ КЛЕТОЧНЫЙ СТИЛЬ) --- */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #000000;
            --border-color: #000000;
            --grid-size: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Строгий шрифт */
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Клеточный фон */
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            background-position: -1px -1px;
        }

        /* Экран приветствия */
        #welcome-screen {
            text-align: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: -2px;
            border-bottom: 4px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
        }

        .company-info {
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .creator {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        .btn-start {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 5px 5px 0px var(--accent-color);
        }

        .btn-start:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--accent-color);
        }

        .btn-start:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--accent-color);
        }

        /* Основной интерфейс чата (скрыт по умолчанию) */
        #chat-interface {
            display: none;
            width: 90%;
            height: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid var(--accent-color);
            box-shadow: 10px 10px 0px var(--accent-color);
            display: flex; /* Будет включено через JS */
            flex-direction: column;
            position: relative;
        }

        /* Верхняя панель */
        .top-bar {
            padding: 15px;
            border-bottom: 4px solid var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .model-selector select {
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            border: 2px solid var(--accent-color);
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        .settings-btn {
            background: none;
            border: 2px solid var(--accent-color);
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Боковая панель (скрывается в настройках) */
        .sidebar {
            width: 200px;
            border-right: 4px solid var(--accent-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .new-chat-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Область чата */
        .chat-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 15px;
            border: 2px solid var(--accent-color);
            position: relative;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: #f0f0f0;
            border-radius: 0;
        }

        .message.bot {
            align-self: flex-start;
            background: #fff;
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Блоки кода */
        pre {
            background: #000;
            color: #fff;
            padding: 15px;
            border: 2px solid #fff;
            overflow-x: auto;
            margin: 10px 0;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
        }

        .copy-btn {
            background: #fff;
            color: #000;
            border: 1px solid #000;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            float: right;
            margin-bottom: -35px;
        }

        /* Настройки внизу слева */
        .settings-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #fff;
            border: 2px solid var(--accent-color);
            padding: 15px;
            display: none;
            box-shadow: 5px 5px 0px var(--accent-color);
        }

        .settings-panel label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .warning-text {
            font-size: 0.7rem;
            color: #555;
            margin-top: 5px;
            font-style: italic;
        }

        /* Анимация загрузки */
        .typing-indicator {
            font-style: italic;
            color: #666;
            font-size: 0.9rem;
        }

        /* Скрытие элементов */
        .hidden { display: none !important; }
        
        /* Стили скроллбара */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #fff; border-left: 1px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }

    </style>
</head>
<body>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcome-screen">
        <h1>ПЕТЯ AI</h1>
        <div class="company-info">Компания "Паток" | Создан: 25.05.2026</div>
        <div class="creator">Разработчик: leymik (Леймик)</div>
        <br><br>
        <button class="btn-start" onclick="startChat()">НАЧАТЬ ОБЩЕНИЕ</button>
    </div>

    <!-- ИНТЕРФЕЙС ЧАТА -->
    <div id="chat-interface" class="hidden">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="model-selector">
                <label for="modelSelect">Модель:</label>
                <select id="modelSelect">
                    <option value="Petya-Flash 1.0">Petya-Flash 1.0 (Быстрая)</option>
                    <option value="Petya-Max 1.0">Petya-Max 1.0 (Умная)</option>
                    <option value="Petya-Plus">Petya-Plus (База данных)</option>
                </select>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ Настройки</button>
        </div>

        <div style="display: flex; flex: 1; overflow: hidden;">
            <!-- Левая панель -->
            <div class="sidebar">
                <button class="new-chat-btn" onclick="newChat()">+ Новый чат</button>
                <div style="font-size: 0.8rem; margin-top: 10px; opacity: 0.6;">
                    История сохраняется в сессии.<br>
                    IP: <span id="user-ip">Загрузка...</span>
                </div>
            </div>

            <!-- Область сообщений -->
            <div class="chat-area" id="chatArea">
                <!-- Сообщения будут появляться здесь -->
            </div>
        </div>

        <!-- Ввод сообщения -->
        <div style="padding: 15px; border-top: 4px solid var(--accent-color); background: #fff;">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="userInput" placeholder="Напишите сообщение Пете..." style="flex: 1; padding: 15px; border: 2px solid #000; font-family: inherit; font-size: 1rem;" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" style="padding: 0 30px; background: #000; color: #fff; border: none; font-weight: bold; cursor: pointer;">SEND</button>
            </div>
        </div>

        <!-- Панель настроек (внизу слева) -->
        <div class="settings-panel" id="settingsPanel">
            <label>
                <input type="checkbox" id="memoryToggle" checked> 
                Память во всех чатах (Вкл)
            </label>
            <p class="warning-text">
                ⚠️ При обновлении страницы все чаты сбрасываются.<br>
                ИИ может ошибаться.
            </p>
            <button onclick="toggleSettings()" style="margin-top: 10px; padding: 5px 10px;">Закрыть</button>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const GROQ_API_KEY = "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";
        
        // Хранилище истории чатов
        let chatHistory = [];
        let isMemoryOn = true;
        let currentModel = "llama3-8b-8192"; // По умолчанию Flash

        // Инициализация при загрузке
        window.onload = function() {
            // Генерация случайного ID сессии (имитация защиты)
            const sessionId = Math.random().toString(36).substring(7);
            history.pushState({id: sessionId}, null, "?chat=" + sessionId);
            
            // Определение IP (для демонстрации, в реальности нужен сервер)
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('user-ip').innerText = data.ip;
                })
                .catch(err => {
                    document.getElementById('user-ip').innerText = "Не определён";
                });
        };

        // Функция старта
        function startChat() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-interface').classList.remove('hidden');
            addBotMessage("Привет! Я Петя AI от компании Паток. Я создан leymik. Чем могу помочь сегодня?");
        }

        // Обработка клавиши Enter
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Отправка сообщения
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            
            if (!message) return;

            // Добавляем сообщение пользователя
            addUserMessage(message);
            inputField.value = '';

            // Определяем модель
            updateModelConfig();

            // Показываем индикатор печати
            const loadingId = showLoadingIndicator();

            try {
                // Формируем контекст диалога
                let contextMessages = [];
                
                // Если память включена, добавляем историю
                if (isMemoryOn && chatHistory.length > 0) {
                    contextMessages = chatHistory.map(msg => ({
                        role: msg.role,
                        content: msg.content
                    }));
                }

                // Добавляем текущее сообщение
                contextMessages.push({ role: "user", content: message });

                // Системный промпт в зависимости от модели
                let systemPrompt = "Ты умный помощник Петя AI.";
                if (currentModel === "mixtral-8x7b-32768") { // Max
                    systemPrompt += " Ты думаешь перед ответом, тщательно проверяешь информацию и даешь развернутые объяснения.";
                } else if (currentModel === "mixtral-8x7b-32768") { // Plus
                    systemPrompt += " Ты работаешь с базой данных, очень внимателен к деталям и пишешь много текста.";
                }

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...contextMessages
                        ],
                        temperature: currentModel.includes("Flash") ? 0.2 : 0.7
                    })
                });

                if (!response.ok) throw new Error("Ошибка сети");

                const data = await response.json();
                const botReply = data.choices[0].message.content;

                // Удаляем индикатор
                removeLoadingIndicator(loadingId);

                // Добавляем ответ бота
                addBotMessage(botReply);

                // Сохраняем в историю (если память включена)
                if (isMemoryOn) {
                    chatHistory.push({ role: "user", content: message });
                    chatHistory.push({ role: "assistant", content: botReply });
                }

            } catch (error) {
                removeLoadingIndicator(loadingId);
                addBotMessage("Связь с Петей не удалась. Попробуйте ещё раз!");
                console.error(error);
            }
        }

        // --- ФУНКЦИИ ИНТЕРФЕЙСА ---

        function addUserMessage(text) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `<strong>Вы</strong>${text}`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function addBotMessage(text) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'message bot';
            
            // Используем marked для форматирования (жирный, код и т.д.)
            const formattedText = marked.parse(text);
            
            div.innerHTML = `<strong>Петя AI</strong>${formattedText}`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function showLoadingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message bot typing-indicator';
            div.innerText = 'Петя думает...';
            chatArea.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function newChat() {
            chatHistory = []; // Сброс памяти
            document.getElementById('chatArea').innerHTML = '';
            addBotMessage("Новый чат начат. Я готов к работе!");
        }

        function updateModelConfig() {
            const select = document.getElementById('modelSelect');
            const selected = select.value;
            
            // Выбор модели GROQ
            if (selected === "Petya-Flash 1.0") {
                currentModel = "llama3-8b-8192";
            } else if (selected === "Petya-Max 1.0") {
                currentModel = "mixtral-8x7b-32768";
            } else if (selected === "Petya-Plus") {
                currentModel = "mixtral-8x7b-32768"; // Та же мощная модель
            }
        }
    </script>
</body>
</html>
